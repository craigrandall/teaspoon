[package]
name = "teaspoon"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Deterministic, loss-aware mining of Outlook .pst and .msg files; a standalone tool"

[[bin]]
name = "tsp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
outlook-pst = "1.2.0"
msg_parser = "0.3"
