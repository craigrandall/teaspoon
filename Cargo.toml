[package]
name = "teaspoon"
version = "0.1.26"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Deterministic, loss-aware mining of Outlook .pst and .msg files; a standalone tool"

[[bin]]
name = "tsp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
outlook-pst = "1.2.0"
msg_parser = "0.3"
compressed-rtf = "1.0"
cfb = "0.15"
unicode-normalization = "0.1.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[dev-dependencies]
proptest = "1.11.0"
